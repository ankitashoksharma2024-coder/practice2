name: Practical CI Build Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout source
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest
      - name: Create unique image tag
        run: echo "IMAGE_TAG=v${{ github.run_number }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        name: Set up Docker Buildx
      - uses: docker/login-action@v3
        name: Login to Docker Hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        name: Build and push image
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/practical-app:${{ env.IMAGE_TAG }}
      - uses: azure/setup-kubectl@v4
        name: Set up kubectl
      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy the exact image from this run
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/practical-app:${{ env.IMAGE_TAG }}
        run: |
          sed -i "s|DOCKERHUB_USERNAME/practical-app:latest|$IMAGE|" deployment.yaml
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          kubectl set image deployment/practical-app practical-app="$IMAGE"
          kubectl rollout status deployment/practical-app --timeout=180s
